# ============================================================
# SonarQube / SonarCloud — SGOHA (TALLER-DE-PROYECTOS-2)
# Stack: Next.js (frontend) + Node/TS + Prisma (backend) + Supabase
# Analiza Frontend y Backend como un solo proyecto multi-módulo.
# ============================================================

sonar.organization=albertreynoso
sonar.projectKey=BryamsVL_TALLER-DE-PROYECTOS-2---202610
sonar.projectName=SGOHA - Taller de Proyectos 2
sonar.projectVersion=1.0

# Codificación y SCM
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# ------------------------------------------------------------
# Exclusiones globales (no analizar dependencias, builds, coverage HTML)
# ------------------------------------------------------------
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/coverage/**,\
  **/cypress/videos/**,\
  **/cypress/screenshots/**,\
  **/prisma/migrations/**,\
  **/*.config.js,**/*.config.mjs,**/*.config.ts,\
  **/dist/**,**/build/**

# Archivos de test (no cuentan como código de producción)
sonar.test.inclusions=\
  **/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,\
  **/cypress/**

# ============================================================
# MÓDULOS
# ============================================================
sonar.modules=backend,frontend

# ---------------- Backend (Node/TS + Vitest) ----------------
backend.sonar.projectBaseDir=backend
backend.sonar.sources=src
backend.sonar.tests=src
backend.sonar.test.inclusions=src/**/*.test.ts,src/**/*.spec.ts
backend.sonar.javascript.lcov.reportPaths=coverage/lcov.info
backend.sonar.exclusions=node_modules/**,coverage/**,prisma/migrations/**,scratch/**,dist/**

# ---------------- Frontend (Next.js + Jest) -----------------
frontend.sonar.projectBaseDir=frontend
frontend.sonar.sources=app,components,lib,hooks
frontend.sonar.tests=app,components,lib,hooks
frontend.sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
frontend.sonar.javascript.lcov.reportPaths=coverage/lcov.info
frontend.sonar.exclusions=node_modules/**,.next/**,coverage/**,cypress/**,public/**,supabase/**
# Excluye componentes interactivos del cliente (*Client.tsx), layouts, páginas de la UI y los componentes base de UI (como shadcn)
frontend.sonar.coverage.exclusions=\
  app/**/*Client.tsx,\
  app/**/page.tsx,\
  app/**/layout.tsx,\
  components/ui/**/*